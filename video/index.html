<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>LeadCall24 &middot; Kurz erklärt</title>
<meta property="og:title" content="LeadCall24 – in 60 Sekunden erklärt">
<meta property="og:description" content="Wie kein verpasster Anruf mehr ein verlorener Kunde wird.">
<style>
:root{
  --ink:#14181d;
  --ink-2:#5a636e;
  --paper:#f6f5f2;
  --card:#ffffff;
  --line:#e4e2dc;
  --signal:#d64518;
  --signal-dark:#b83a12;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.55;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:32px 20px 40px;
}
.wrap{width:100%;max-width:460px;margin:auto 0}

.brandline{
  display:flex;align-items:center;gap:9px;
  justify-content:center;
  margin-bottom:26px;
}
.dot{width:9px;height:9px;border-radius:50%;background:var(--signal)}
.brand{
  font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink);
}

h1{
  font-size:26px;
  line-height:1.22;
  font-weight:750;
  letter-spacing:-.02em;
  text-align:center;
  margin-bottom:8px;
}
.sub{
  text-align:center;
  color:var(--ink-2);
  font-size:15px;
  margin-bottom:22px;
}

.videobox{
  position:relative;
  width:100%;
  border-radius:16px;
  overflow:hidden;
  background:#000;
  border:1px solid var(--line);
  box-shadow:0 10px 34px rgba(20,24,29,.14);
  aspect-ratio:9/16;
}
.videobox video{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}

.after{
  margin-top:24px;
  text-align:center;
}
.after p{
  color:var(--ink-2);
  font-size:15px;
  margin-bottom:16px;
}
.cta{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  width:100%;
  padding:16px 20px;
  background:var(--signal);
  color:#fff;
  font-size:16.5px;
  font-weight:700;
  text-decoration:none;
  border-radius:12px;
  transition:background .12s;
}
.cta:hover{background:var(--signal-dark)}
.cta svg{width:19px;height:19px;flex-shrink:0}

.contact{
  margin-top:18px;
  font-size:14px;
  color:var(--ink-2);
  text-align:center;
  line-height:1.7;
}
.contact a{color:var(--ink);text-decoration:none;font-weight:600}
.contact a:hover{text-decoration:underline}

.foot{
  margin-top:34px;
  text-align:center;
  font-size:12px;
  color:#9aa1a9;
}
.foot a{color:#9aa1a9}
</style>
</head>
<body>
  <div class="wrap">

    <div class="brandline">
      <span class="dot"></span>
      <span class="brand">LeadCall24</span>
    </div>

    <h1>Kein verpasster Anruf ist mehr ein verlorener Kunde.</h1>
    <p class="sub">In 60 Sekunden, wie das bei Ihnen laufen würde.</p>

    <div class="videobox">
      <video
        src="https://fbkkyzvumytipjtnrjrn.supabase.co/storage/v1/object/public/videos/smart-repair.mp4.mp4"
        controls
        playsinline
        preload="metadata">
      </video>
    </div>

    <div class="after">
      <p>Fragen, oder direkt loslegen? Rufen Sie mich an — ich erkläre Ihnen alles in fünf Minuten.</p>
      <a class="cta" href="tel:+491631692010">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
        Jetzt anrufen
      </a>
      <div class="contact">
        Tristan Haupt &middot; LeadCall24<br>
        <a href="mailto:tristan@leadcall24.de">tristan@leadcall24.de</a>
      </div>
    </div>

    <div class="foot">
      <a href="https://www.leadcall24.de" target="_blank" rel="noopener">leadcall24.de</a>
    </div>

  </div>
</body>
</html>
